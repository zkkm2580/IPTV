name: Build IPTV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 配置 Gradle 环境
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: 编译 Debug APK
      run: gradle assembleDebug --stacktrace

    - name: 整理发布 APK 文件
      id: release_apk
      run: |
        TAG_NAME="v1.0.0-$(date +'%Y%m%d%H%M')"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        mkdir -p release_dist
        cp app/build/outputs/apk/debug/*.apk "release_dist/IPTV直播电视.apk"
        cp app/build/outputs/apk/debug/*.apk "release_dist/IPTV-Latest.apk"

    - name: 上传 APK 安装包至 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: IPTV-Debug-APK
        path: release_dist/IPTV直播电视.apk
        retention-days: 7

    - name: 发布 APK 到 GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_apk.outputs.tag_name }}
        name: IPTV直播电视 v1.0.0 (${{ steps.release_apk.outputs.tag_name }})
        body: |
          ### IPTV 直播电视播放器发布说明
          
          - 📺 **高性能现代流媒体播放引擎**：
            - 基于 AndroidX Media3 (ExoPlayer) 核心框架构建，启动秒开；
            - 深度支持 HLS (`.m3u8`)、HTTP-TS、RTMP/RTSP 等多种广电级直播流协议；
            - 支持智能错误自愈与流断线自动重连。
          
          - 📑 **全格式 M3U / M3U8 列表解析**：
            - 支持解析标准 `#EXTM3U`、`#EXTINF` 扩展标签（台标、分组、EPG ID）；
            - 内置央视频道、省市卫视等高清直播源预设，支持网络列表在线更新。
          
          - 🎮 **电视盒子遥控器与车载触屏双重适配**：
            - 针对电视遥控器方向键（上下换台、左右换组、OK 呼出选台栏）；
            - 触屏手势切换频道与沉浸式全屏 OSD 节目状态显示。
        files: |
          release_dist/IPTV直播电视.apk
          release_dist/IPTV-Latest.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
